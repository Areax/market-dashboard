name: Update dashboard and deploy to GitHub Pages

on:
  # GitHub Actions cron is UTC-only and doesn't shift for daylight saving,
  # so this runs two schedules - one for each side of the DST switch.
  #
  # GitHub's free scheduler has been delivering these runs 4-6 hours late in
  # practice (not the "a few minutes" its docs describe as typical) - a
  # known characteristic of the `schedule` trigger, and apparently worse for
  # this repo than GitHub's docs would suggest. An earlier version tried to
  # compensate with a strict "is it currently ~8am ET?" guard, but with
  # delays that large it rejected nearly every run, including the one that
  # should have counted, so the site silently stopped updating - the guard
  # is gone now, every delivered run completes regardless of clock time.
  #
  # These cron times are set for 2:00am ET rather than the actual 8am
  # target, betting on that same 4-6h delay landing delivery around
  # 6-8am ET. That's based on only a handful of observed samples, not a
  # guarantee GitHub's load-dependent delay stays in that range - if actual
  # delivery times (compare each run's start time on the Actions tab against
  # its cron) drift outside it, these need adjusting again.
  schedule:
    - cron: "0 7 * * 1-5"  # nominally 2:00am EST (UTC-5)
    - cron: "0 6 * * 1-5"  # nominally 2:00am EDT (UTC-4)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refresh all data sources
        run: python refresh_all.py --force

      - name: Build static site
        run: python build_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
