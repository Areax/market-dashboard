name: Update dashboard and deploy to GitHub Pages

on:
  # GitHub Actions cron is UTC-only and doesn't shift for daylight saving,
  # so this runs two schedules - one for each side of the DST switch - aimed
  # at 8:00am ET on weekdays.
  #
  # In practice GitHub's scheduler has been delivering these hours late
  # (observed 4-6+ hours late, not the "a few minutes" GitHub's docs
  # describe as typical) - a known characteristic of the free `schedule`
  # trigger, worse on some days than others. An earlier version of this
  # workflow tried to compensate with a strict "is it currently ~8am ET?"
  # guard meant only to filter out the wrong-season cron entry - but with
  # delays this large, that guard ended up rejecting nearly every run,
  # including the one that should count, so the site silently stopped
  # updating. There's no fix for GitHub's own scheduling latency from here,
  # so this just always runs to completion once GitHub actually delivers
  # the job, whatever the actual clock time turns out to be, favoring "did
  # the data refresh today" over "did it refresh at exactly 8am."
  schedule:
    - cron: "0 13 * * 1-5"  # nominally 8:00am EST (UTC-5)
    - cron: "0 12 * * 1-5"  # nominally 8:00am EDT (UTC-4)
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refresh all data sources
        run: python refresh_all.py --force

      - name: Build static site
        run: python build_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
