name: Update dashboard and deploy to GitHub Pages

on:
  # GitHub's free scheduler delivers these runs 4-6+ hours late in practice
  # (observed: 4h33m to 7h55m), so the cron is set far ahead of the real
  # ~8am ET target. One entry only: with delays this large, matching ET
  # exactly across daylight saving doesn't matter, and a second DST-paired
  # entry would run again later and overwrite the morning snapshot with
  # mid-session data. 06:00 UTC is 2am EDT / 1am EST.
  #
  # Every delivered run completes regardless of clock time - an earlier
  # "is it ~8am ET?" guard rejected nearly every late-delivered run and the
  # site silently stopped updating. If delivery times (each run's start
  # time on the Actions tab) drift past ~8am ET, move this earlier.
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refresh all data sources
        run: python refresh_all.py --force

      - name: Build static site
        run: python build_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
