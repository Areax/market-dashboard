name: Update dashboard and deploy to GitHub Pages

on:
  # Once a day after the US close. 22:00 UTC = 5pm EST / 6pm EDT, so the
  # run always sees the day's final bar. GitHub's free scheduler often
  # delivers scheduled runs hours late (4.5h to 7.5h observed); that is
  # fine here, since a late run still picks up the same close. Every
  # delivered run completes regardless of clock time.
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run offline tests (no look-ahead, indicator math, event-study stats)
        run: python -m unittest discover -s tests -t .

      - name: Install Playwright's Chromium
        run: python -m playwright install --with-deps chromium

      - name: Refresh all data sources
        run: python refresh_all.py --force

      - name: Build static site
        run: python build_static.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
